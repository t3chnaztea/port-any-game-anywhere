name: Source and behavior checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: python3 tools/check_repository.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s evaluations/tests -v
      - run: python3 -m unittest discover -s examples/fifteen-pilot -p 'test_*.py' -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/recovery-puzzle
      - run: npm test
        working-directory: examples/recovery-puzzle
      - run: python3 tools/build_example.py
      - run: python3 tools/build_release.py --development
